name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [masterBranch]
  workflow_dispatch:

jobs:
  luacheck:
    name: Luacheck (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 + LuaRocks
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - name: Install luacheck
        uses: leafo/gh-actions-luarocks@v6
        with:
          luacheckluaVersion: "5.1"

      - name: Run luacheck
        run: |
          luarocks install luacheck
          luacheck .

  love-smoke:
    name: LÖVE2D smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LÖVE2D, virtual display and software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y love xvfb libgl1-mesa-dri

      - name: Boot check (virtual display, 10s timeout)
        run: |
          # The game must reach love.load and run update/draw cycles
          # without crashing. Rendering happens on a virtual display
          # (xvfb) with Mesa software OpenGL (llvmpipe).
          # timeout kills the game after 10s with exit 124; any other
          # early non-zero exit is a real boot crash.
          timeout 10s xvfb-run -a love . || code=$?
          if [ -n "$code" ] && [ "$code" != "124" ]; then
            echo "::error::game failed to boot (exit $code)"
            exit 1
          fi
